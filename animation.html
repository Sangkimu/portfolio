<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Animation Clips | Kevin Cheruiyot Sang</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="gallery-page animation-page">
    <main class="gallery">
        <a class="gallery__back" href="./index.html#portfolio">Back to portfolio</a>

        <header class="gallery__header">
            <p class="gallery__eyebrow">Selected motion work</p>
            <h1>2D Animation Clips</h1>
            <p>Frame-by-frame animation, motion graphics, and visual storytelling experiments.</p>
            <button class="animation-sound-toggle" type="button">Play with sound</button>
        </header>

        <section class="animation-gallery" aria-label="Animation clips">
            <article class="animation-gallery__item">
                <video controls playsinline preload="auto" aria-labelledby="reel6-title">
                    <source src="./images/animations/reel6.mp4" type="video/mp4">
                </video>
                <audio controls preload="auto" aria-label="Audio for Reel 6">
                    <source src="./images/animations/reel6.mp4" type="audio/mp4">
                </audio>
                <h2 id="reel6-title">Reel 6</h2>
            </article>
            <article class="animation-gallery__item">
                <video controls playsinline preload="auto" aria-labelledby="reel7-title">
                    <source src="./images/animations/reel7.mp4" type="video/mp4">
                </video>
                <audio controls preload="auto" aria-label="Audio for Reel 7">
                    <source src="./images/animations/reel7.mp4" type="audio/mp4">
                </audio>
                <h2 id="reel7-title">Reel 7</h2>
            </article>
            <article class="animation-gallery__item">
                <video controls playsinline preload="auto" aria-labelledby="reel75-title">
                    <source src="./images/animations/reel7-5.mp4" type="video/mp4">
                </video>
                <audio controls preload="auto" aria-label="Audio for Reel 7.5">
                    <source src="./images/animations/reel7-5.mp4" type="audio/mp4">
                </audio>
                <h2 id="reel75-title">Reel 7.5</h2>
            </article>
            <article class="animation-gallery__item">
                <video controls playsinline preload="auto" aria-labelledby="reel8-title">
                    <source src="./images/animations/reel8.mp4" type="video/mp4">
                </video>
                <audio controls preload="auto" aria-label="Audio for Reel 8">
                    <source src="./images/animations/reel8.mp4" type="audio/mp4">
                </audio>
                <h2 id="reel8-title">Reel 8</h2>
            </article>
        </section>
    </main>

    <script>
        const animationVideos = [...document.querySelectorAll('.animation-gallery video')];
        const soundToggle = document.querySelector('.animation-sound-toggle');

        soundToggle.addEventListener('click', async () => {
            animationVideos.forEach((video) => {
                video.muted = false;
                video.volume = 1;
            });
            try {
                await animationVideos[0].play();
                soundToggle.textContent = 'Sound enabled';
                soundToggle.disabled = true;
            } catch (error) {
                soundToggle.textContent = 'Use the video play button';
            }
        });
    </script>
</body>
</html>
