<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Gallery | Kevin Cheruiyot Sang</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="gallery-page">
    <main class="gallery">
        <a class="gallery__back" href="index.html#portfolio">Back to portfolio</a>
        <header class="gallery__header">
            <p class="gallery__eyebrow">Selected work</p>
            <h1>Graphics Design Gallery</h1>
            <p>A collection of branding, digital media, web, and visual design projects.</p>
        </header>
        <section class="gallery__grid" aria-label="Project gallery">
            <figure class="gallery__item gallery__item--wide">
                <img src="./images/delani.png" alt="Delani design project">
                <figcaption>Brand and visual design</figcaption>
            </figure>
            <figure class="gallery__item">
                <img src="./images/eoszidi.png" alt="Eoszidi design project">
                <figcaption>Digital interface design</figcaption>
            </figure>
            <figure class="gallery__item">
                <img src="./images/fk.jpg" alt="FK design project">
                <figcaption>Creative digital media</figcaption>
            </figure>
            <figure class="gallery__item">
                <img src="./images/halisi.png" alt="Halisi design project">
                <figcaption>Identity and layout</figcaption>
            </figure>
            <figure class="gallery__item gallery__item--wide">
                <img src="./images/home.png" alt="Home page design project">
                <figcaption>Web and graphic design</figcaption>
            </figure>
            <figure class="gallery__item">
                <img src="./images/restaurant.jpg" alt="Restaurant design project">
                <figcaption>Promotional design</figcaption>
            </figure>
            <figure class="gallery__item">
                <img src="./images/Screenshot from 2023-05-11 09-44-37.png" alt="Project design screenshot">
                <figcaption>Interface exploration</figcaption>
            </figure>
            <figure class="gallery__item">
                <img src="./images/Screenshot from 2023-05-11 09-45-45.png" alt="Project design screenshot">
                <figcaption>Digital composition</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
