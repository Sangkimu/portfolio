<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Gallery | Kevin Cheruiyot Sang</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="gallery-page">
    <main class="gallery">
        <a class="gallery__back" href="index.html#portfolio">Back to portfolio</a>

        <header class="gallery__header">
            <p class="gallery__eyebrow">Selected work</p>
            <h1>Graphics Design Gallery</h1>
            <p>A collection of branding, digital media, web, and visual design projects.</p>
        </header>

        <div class="gallery__albums">
            <article class="album" data-gallery="flyers">
                <div class="album__header">
                    <div>
                        <p class="gallery__eyebrow">Category</p>
                        <h2>Flyers</h2>
                    </div>
                    <span class="album__count">13 designs</span>
                </div>

                <button class="album__card" type="button" aria-label="View next flyer design">
                    <div class="album__photo">
                        <img src="" alt="">
                    </div>
                    <div class="album__meta">
                        <span class="album__tag">Flyer</span>
                        <strong class="album__label"></strong>
                    </div>
                </button>
            </article>

            <article class="album" data-gallery="posters">
                <div class="album__header">
                    <div>
                        <p class="gallery__eyebrow">Category</p>
                        <h2>Posters</h2>
                    </div>
                    <span class="album__count">24 designs</span>
                </div>

                <button class="album__card" type="button" aria-label="View next poster design">
                    <div class="album__photo">
                        <img src="" alt="">
                    </div>
                    <div class="album__meta">
                        <span class="album__tag">Poster</span>
                        <strong class="album__label"></strong>
                    </div>
                </button>
            </article>
        </div>
    </main>

    <script>
        const galleryData = {
            flyers: [
                { src: './images/galary/flayers/BCTVC Flayer-Accommodation.L4.png', title: 'Accommodation' },
                { src: './images/galary/flayers/BCTVC Flayer-Banking&Finance.L6.jpg', title: 'Banking and Finance' },
                { src: './images/galary/flayers/BCTVC Flayer-Cosmetology.L5.png', title: 'Cosmetology' },
                { src: './images/galary/flayers/BCTVC Flayer-Counselling.L5.jpg', title: 'Counselling' },
                { src: './images/galary/flayers/BCTVC Flayer-Elect.L6.png', title: 'Electrical' },
                { src: './images/galary/flayers/BCTVC Flayer-FPCookery.l4.png', title: 'Food Production and Cookery' },
                { src: './images/galary/flayers/BCTVC Flayer-HR.L5.jpg', title: 'Human Resources' },
                { src: './images/galary/flayers/BCTVC Flayer-Masonry.L4.jpg', title: 'Masonry' },
                { src: './images/galary/flayers/BCTVC Flayer-Packages.png', title: 'Packages' },
                { src: './images/galary/flayers/BCTVC Flayer-SC.Institutional management.jpg', title: 'Institutional Management' },
                { src: './images/galary/flayers/BCTVC Flayer-WaterEngineering.L6.jpg', title: 'Water Engineering' },
                { src: './images/galary/flayers/ICT l6.corrected.png', title: 'ICT' },
                { src: './images/galary/flayers/LS.jpg', title: 'Life Skills' }
            ],
            posters: [
                { src: './images/galary/posters/13Sunday.png', title: '13 Sunday' },
                { src: './images/galary/posters/19th, Oct.2025.Sunday.jpg', title: '19 October 2025 Sunday' },
                { src: './images/galary/posters/1STFEB,2026SUNDAY.jpg', title: '1 February 2026 Sunday' },
                { src: './images/galary/posters/22ND FEB.jpg', title: '22 February' },
                { src: './images/galary/posters/25JAN.CU.jpg', title: '25 January Christian Union' },
                { src: './images/galary/posters/28sunday,sep.png', title: '28 September Sunday' },
                { src: './images/galary/posters/6July,2025.png', title: '6 July 2025' },
                { src: './images/galary/posters/8TH.MARCH.CU.jpg', title: '8 March Christian Union' },
                { src: './images/galary/posters/CU calendar1.jpg', title: 'Christian Union Calendar' },
                { src: './images/galary/posters/CU kesha1.jpg', title: 'Christian Union Kesha' },
                { src: './images/galary/posters/CU Rally.jpg', title: 'Christian Union Rally' },
                { src: './images/galary/posters/CU Sunday1.png', title: 'Christian Union Sunday' },
                { src: './images/galary/posters/Cultural Day-01.jpg', title: 'Cultural Day' },
                { src: './images/galary/posters/FRESHERS CONNECT.jpg', title: 'Freshers Connect' },
                { src: './images/galary/posters/Fun Day.jpg', title: 'Fun Day' },
                { src: './images/galary/posters/KATTI PRINCIPAL BCTVC 2.0.jpg', title: 'KATTI Principal BCTVC' },
                { src: './images/galary/posters/KATTI PRINCIPAL BCTVC 2.jpg', title: 'KATTI Principal BCTVC' },
                { src: './images/galary/posters/KATTI PRINCIPAL BCTVC.jpg', title: 'KATTI Principal BCTVC' },
                { src: './images/galary/posters/Mashujaa Day.jpg', title: 'Mashujaa Day' },
                { src: './images/galary/posters/Mazingira Day.3.jpg', title: 'Mazingira Day' },
                { src: './images/galary/posters/Methodist 29th.jpg', title: 'Methodist 29th' },
                { src: './images/galary/posters/STANLEY.CU.POSTER.jpg', title: 'Stanley Christian Union' },
                { src: './images/galary/posters/sunday.17.cu.jpg', title: '17 Sunday Christian Union' },
                { src: './images/galary/posters/sunday8thFeb.jpg', title: '8 February Sunday' },
                { src: './images/galary/posters/worship expernce.jpg', title: 'Worship Experience' }
            ]
        };

        document.querySelectorAll('.album').forEach((album) => {
            const key = album.dataset.gallery;
            const items = galleryData[key];
            const button = album.querySelector('.album__card');
            const img = album.querySelector('img');
            const label = album.querySelector('.album__label');
            let currentIndex = 0;

            const render = () => {
                const item = items[currentIndex];
                img.src = item.src;
                img.alt = item.title;
                label.textContent = item.title;
                button.setAttribute('aria-label', `View next ${key.slice(0, -1)} design: ${item.title}`);
            };

            render();

            button.addEventListener('click', () => {
                currentIndex = (currentIndex + 1) % items.length;
                render();
            });
        });
    </script>
</body>
</html>
